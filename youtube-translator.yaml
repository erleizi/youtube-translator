name: "🌐 YouTube 字幕翻译"
description: "独立字幕翻译，只干翻译一件事：拦截 YouTube 字幕请求，让 YouTube 服务器直接返回翻译好的字幕（官方自动翻译机制）。目标语言在下方设置里改。"
author: "白日梦"

# 模块设置页里渲染出的控件：脚本里用 ctx.env.TARGET_LANG 读取
env_schema:
  TARGET_LANG:
    name: 目标语言
    description: "字幕翻译的目标语言，默认简体中文。改完下次播放即时生效。"
    default_value: "zh-CN"
    options:
      - "zh-CN"
      - "zh-TW"
      - "en"
      - "ja"
      - "ko"
      - "fr"
      - "de"
      - "es"
      - "ru"
      - "th"

mitm:
  hostnames:
    includes:
      - "www.youtube.com"
      - "m.youtube.com"

scriptings:
  - http_request:
      name: "🌐 字幕翻译"
      match: '^https://(www|m)\.youtube\.com/api/timedtext'
      script_url: "https://raw.githubusercontent.com/erleizi/youtube-translator/main/youtube-translate-v3.js"
      timeout: 10
